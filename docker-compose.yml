services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pulsewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch -d pulsewatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      DATABASE_URL: postgresql+asyncpg://pulsewatch:password@db:5432/pulsewatch
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *app_env
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker.main"]
    # Container healthcheck inherited from the image probes the API port,
    # which this process does not serve.
    healthcheck:
      disable: true
    environment: *app_env
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
